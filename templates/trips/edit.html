{% extends "base.html" %}

{% block title %}Edit Trip Plan: {{ trip.trip_name }} - YatraSetu{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <a href="{{ url_for('trip_detail', trip_id=trip.trip_id) }}" style="color: var(--color-accent); text-decoration: none; font-size: 0.88rem;">&larr; Back to Trip Itinerary</a>
        <h1 class="page-title" style="margin-top: 0.35rem;">Edit Trip Plan #{{ trip.trip_id }}</h1>
        <p class="page-subtitle">Update itinerary parameters and notes</p>
    </div>
</div>

<div class="detail-section" style="max-width: 750px; margin: 0 auto 3rem;">
    <form method="POST" class="needs-validation">
        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1rem; margin-bottom: 1rem;">
            <div class="form-group">
                <label class="form-label" for="trip_name">Trip Name *</label>
                <input type="text" id="trip_name" name="trip_name" class="form-control" required maxlength="150" value="{{ trip.trip_name }}">
            </div>

            <div class="form-group">
                <label class="form-label" for="planned_duration_days">Planned Duration (Days) *</label>
                <input type="number" id="planned_duration_days" name="planned_duration_days" class="form-control" required min="1" max="90" value="{{ trip.planned_duration_days }}">
            </div>
        </div>

        <div class="form-group" style="margin-bottom: 1rem;">
            <label class="form-label" for="starting_city">Starting Departure City *</label>
            <select id="starting_city" name="starting_city" class="form-control" required>
                {% for city in starting_cities %}
                    <option value="{{ city }}" {% if trip.starting_city == city %}selected{% endif %}>{{ city }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
            <label class="form-label" for="notes">Trip Notes (Optional)</label>
            <textarea id="notes" name="notes" class="form-control" rows="3">{{ trip.notes or '' }}</textarea>
        </div>

        <div style="display: flex; gap: 1rem; justify-content: flex-end;">
            <a href="{{ url_for('trip_detail', trip_id=trip.trip_id) }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">💾 Save Changes</button>
        </div>
    </form>
</div>
{% endblock %}
